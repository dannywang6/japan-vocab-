name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Backend
        run: |
          cd JP_project
          mvn package -DskipTests
          cp target/*.jar ../docker-project/backend/app.jar

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Build Frontend
        run: |
          cd jp-frontend
          npm install
          npm run build
          rm -rf ../docker-project/frontend/dist
          cp -r dist ../docker-project/frontend/dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Docker Images
        run: |
          cd docker-project
          docker build -t ghcr.io/dannywang6/jp-backend:latest ./backend
          docker build -t ghcr.io/dannywang6/jp-frontend:latest ./frontend
          docker push ghcr.io/dannywang6/jp-backend:latest
          docker push ghcr.io/dannywang6/jp-frontend:latest
