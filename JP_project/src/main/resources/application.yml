spring:
  datasource:
    url: jdbc:mysql://localhost:3306/JP_project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jp_project.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

baidu:
  translate:
    appid: ${BAIDU_APPID}
    api-key: ${BAIDU_API_KEY}

ai:
  api-key: ${AI_API_KEY}
  model: qwen-turbo