version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: my-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ***REMOVED***
      MYSQL_DATABASE: JP_project
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./JP_project.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - my-network

  backend:
    build: ./backend
    container_name: my-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/JP_project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ***REMOVED***
    depends_on:
      - mysql
    networks:
      - my-network

  frontend:
    build: ./frontend
    container_name: my-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  mysql-data:
